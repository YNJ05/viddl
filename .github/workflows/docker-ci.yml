name: Docker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image locally
        run: |
          docker build -t viddl:latest .

      - name: Run Container & Verify Health
        run: |
          # Start the container
          docker run -d --name viddl-test -p 8000:8000 viddl:latest
          
          # Wait for it to become healthy
          echo "Waiting for app to start..."
          for i in {1..10}; do
            if curl -s -f http://localhost:8000/ > /dev/null; then
              echo "✅ Application successfully responded at http://localhost:8000/"
              docker stop viddl-test && docker rm viddl-test
              exit 0
            fi
            sleep 1
          done
          
          echo "❌ Application failed to respond. Printing container logs:"
          docker logs viddl-test
          docker stop viddl-test && docker rm viddl-test
          exit 1

  publish:
    name: Publish to GitHub Container Registry (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only publish on pushes to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner Name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/viddl:latest
            ghcr.io/${{ env.OWNER_LC }}/viddl:${{ github.sha }}
