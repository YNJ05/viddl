<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidDL — Video Downloader</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #080a0f;
      --surface: #0e1118;
      --surface2: #161b26;
      --border: #1e2535;
      --accent: #00e5ff;
      --accent2: #ff3d6b;
      --accent3: #a259ff;
      --text: #e8eaf0;
      --muted: #4a5568;
      --muted2: #718096;
      --success: #00ff9d;
      --warning: #ffb800;
      --error: #ff4757;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      padding: 40px 0 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
    }

    .logo-text span {
      color: var(--accent);
    }

    .version-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted2);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 2px;
      margin-left: auto;
      letter-spacing: 1px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 6px;
      margin-bottom: 28px;
      width: fit-content;
    }

    .tab {
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--muted2);
      transition: all 0.2s;
      border: none;
      background: none;
      font-family: var(--sans);
    }

    .tab.active {
      background: var(--surface2);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* URL Input Area */
    .url-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .url-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
    }

    .url-label {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .url-row {
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px 16px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08);
    }

    .url-input::placeholder {
      color: var(--muted);
    }

    .btn-fetch {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 6px;
      padding: 13px 22px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-fetch:hover {
      background: #33ecff;
      transform: translateY(-1px);
    }

    .btn-fetch:active {
      transform: translateY(0);
    }

    .btn-fetch:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Platforms badge row */
    .platforms {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .platform-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 2px;
      border: 1px solid var(--border);
      color: var(--muted2);
      letter-spacing: 0.5px;
    }

    /* Video Info Card */
    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .info-inner {
      display: flex;
      gap: 0;
    }

    .thumbnail-wrap {
      width: 200px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      background: var(--surface2);
    }

    .thumbnail-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 70%, var(--surface));
    }

    .info-meta {
      flex: 1;
      padding: 20px 20px 20px 16px;
    }

    .info-platform {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .info-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
      color: var(--text);
    }

    .info-stats {
      display: flex;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted2);
      margin-bottom: 14px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Options */
    .options-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .select-wrap {
      position: relative;
      flex: 1;
      min-width: 140px;
    }

    .select-label {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted2);
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 9px 12px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--accent);
    }

    .toggle-wrap {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 5px;
    }

    .toggle-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .toggle {
      width: 36px;
      height: 20px;
      background: var(--border);
      border-radius: 10px;
      position: relative;
      transition: background 0.2s;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle.on {
      background: var(--accent);
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
    }

    .toggle.on::after {
      left: 19px;
    }

    .toggle-text {
      font-size: 12px;
      font-family: var(--mono);
      color: var(--muted2);
    }

    /* Download Button */
    .btn-download {
      width: 100%;
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      color: white;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .btn-download:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-download:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Progress Card */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-status {
      font-size: 12px;
      font-family: var(--mono);
      letter-spacing: 1px;
    }

    .status-downloading {
      color: var(--accent);
    }

    .status-processing {
      color: var(--accent3);
    }

    .status-done {
      color: var(--success);
    }

    .status-error {
      color: var(--error);
    }

    .status-queued {
      color: var(--warning);
    }

    .progress-pct {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      font-family: var(--mono);
    }

    .progress-bar-wrap {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      border-radius: 3px;
      transition: width 0.3s ease;
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -2px;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .progress-details {
      display: flex;
      gap: 20px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted2);
    }

    /* Files List */
    .files-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .files-title {
      font-size: 13px;
      font-family: var(--mono);
      color: var(--muted2);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .btn-refresh {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted2);
      padding: 6px 12px;
      font-size: 11px;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }

    .file-item:hover {
      border-color: var(--accent);
    }

    .file-icon {
      width: 36px;
      height: 36px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .file-icon.video {
      background: rgba(255, 61, 107, 0.15);
    }

    .file-icon.audio {
      background: rgba(162, 89, 255, 0.15);
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .file-meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted2);
    }

    .file-actions {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted2);
      padding: 7px 12px;
      font-size: 11px;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-action.dl:hover {
      border-color: var(--success);
      color: var(--success);
    }

    .btn-action.rm:hover {
      border-color: var(--error);
      color: var(--error);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .empty-state .empty-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Loader */
    .loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      z-index: 1000;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      max-width: 300px;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.success {
      border-color: var(--success);
      color: var(--success);
    }

    #toast.error {
      border-color: var(--error);
      color: var(--error);
    }

    /* Error box */
    .error-box {
      background: rgba(255, 71, 87, 0.08);
      border: 1px solid rgba(255, 71, 87, 0.3);
      border-radius: 6px;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--error);
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 32px 0 24px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .info-inner {
        flex-direction: column;
      }

      .thumbnail-wrap {
        width: 100%;
        height: 160px;
      }

      .options-row {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>

  <div class="container">
    <header>
      <img class="logo-img" src="/assets/logo.png" alt="VidDL Logo">
      <div class="logo-text">Vid<span>DL</span></div>
      <div class="version-tag">v1.0.0</div>
    </header>



    <!-- DOWNLOAD TAB -->
    <div id="tab-download" class="tab-panel active">

      <div class="url-card">
        <div class="url-label">// Paste a video URL</div>
        <div class="url-row">
          <input class="url-input" type="text" id="urlInput"
            placeholder="https://youtube.com/watch?v=... or any supported site"
            onkeydown="if(event.key==='Enter') fetchInfo()">
          <button class="btn-fetch" id="fetchBtn" onclick="fetchInfo()">Fetch Info</button>
        </div>
        <div class="platforms">
          <span class="platform-badge">YouTube</span>
          <span class="platform-badge">Twitter/X</span>
          <span class="platform-badge">Instagram</span>
          <span class="platform-badge">TikTok</span>
          <span class="platform-badge">Vimeo</span>
          <span class="platform-badge">Reddit</span>
          <span class="platform-badge">Twitch</span>
          <span class="platform-badge">+1000 more</span>
        </div>
      </div>

      <!-- Video Info -->
      <div id="infoCard" class="info-card hidden">
        <div class="info-inner">
          <div class="thumbnail-wrap" id="thumbWrap">
            <img id="thumbnail" src="" alt="">
            <div class="thumb-overlay"></div>
          </div>
          <div class="info-meta">
            <div class="info-platform" id="infoPlatform">PLATFORM</div>
            <div class="info-title" id="infoTitle">—</div>
            <div class="info-stats">
              <span class="stat-item" id="infoDuration">⏱ —</span>
              <span class="stat-item" id="infoViews">👁 —</span>
              <span class="stat-item" id="infoUploader">👤 —</span>
            </div>
            <div class="options-row">
              <div class="select-wrap">
                <div class="select-label">Quality</div>
                <select id="qualitySelect">
                  <option value="best">Best Available</option>
                  <option value="1080">1080p</option>
                  <option value="720">720p</option>
                  <option value="480">480p</option>
                  <option value="360">360p</option>
                </select>
              </div>
              <div class="select-wrap">
                <div class="select-label">Format</div>
                <select id="formatSelect">
                  <option value="mp4">MP4 (Video)</option>
                  <option value="webm">WebM (Video)</option>
                  <option value="mp3">MP3 (Audio)</option>
                </select>
              </div>
              <div class="toggle-wrap">
                <div class="select-label">Audio Only</div>
                <div class="toggle-label-row" onclick="toggleAudio()">
                  <div class="toggle" id="audioToggle"></div>
                  <span class="toggle-text" id="audioToggleText">off</span>
                </div>
              </div>
            </div>
            <button class="btn-download" id="downloadBtn" onclick="startDownload()">
              ↓ Download Now
            </button>
          </div>
        </div>
      </div>

      <!-- Progress -->
      <div id="progressCard" class="progress-card hidden">
        <div class="progress-header">
          <div>
            <div class="progress-status" id="progressStatus">QUEUED</div>
            <div style="font-size:12px; color:var(--muted2); font-family:var(--mono); margin-top:2px;"
              id="progressFile"></div>
          </div>
          <div class="progress-pct" id="progressPct">0%</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="progress-details">
          <span id="progressSpeed">Speed: —</span>
          <span id="progressEta">ETA: —</span>
        </div>
        <div id="progressError" class="error-box hidden"></div>
      </div>

    </div><!-- end download tab -->



  </div><!-- container -->

  <footer>VidDL — Powered by yt-dlp &amp; FastAPI &nbsp;|&nbsp; Running in Docker</footer>

  <div id="toast"></div>

  <script>
    let currentJob = null;
    let audioOnly = false;
    let pollInterval = null;
    let currentVideoInfo = null;

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'library') loadFiles();
    }

    function toggleAudio() {
      audioOnly = !audioOnly;
      const toggle = document.getElementById('audioToggle');
      const text = document.getElementById('audioToggleText');
      toggle.classList.toggle('on', audioOnly);
      text.textContent = audioOnly ? 'on' : 'off';
      const fmtSelect = document.getElementById('formatSelect');
      if (audioOnly) {
        fmtSelect.value = 'mp3';
      } else {
        fmtSelect.value = 'mp4';
      }
    }

    function formatDuration(secs) {
      if (!secs) return '—';
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function formatViews(n) {
      if (!n) return '—';
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      return n.toString();
    }

    function formatSize(bytes) {
      if (bytes >= 1e9) return (bytes / 1e9).toFixed(2) + ' GB';
      if (bytes >= 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
      if (bytes >= 1e3) return (bytes / 1e3).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    async function fetchInfo() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return showToast('Please enter a URL', 'error');

      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Fetching...';
      document.getElementById('infoCard').classList.add('hidden');

      try {
        const res = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Failed to fetch info');
        }
        const info = await res.json();
        currentVideoInfo = info;
        displayInfo(info);
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Fetch Info';
      }
    }

    function displayInfo(info) {
      const card = document.getElementById('infoCard');
      document.getElementById('infoPlatform').textContent = (info.platform || 'UNKNOWN').toUpperCase();
      document.getElementById('infoTitle').textContent = info.title || 'Unknown Title';
      document.getElementById('infoDuration').textContent = '⏱ ' + formatDuration(info.duration);
      document.getElementById('infoViews').textContent = '👁 ' + formatViews(info.view_count);
      document.getElementById('infoUploader').textContent = '👤 ' + (info.uploader || '—');

      if (info.thumbnail) {
        document.getElementById('thumbnail').src = info.thumbnail;
        document.getElementById('thumbWrap').style.display = 'block';
      } else {
        document.getElementById('thumbWrap').style.display = 'none';
      }

      card.classList.remove('hidden');
    }

    async function startDownload() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      const quality = document.getElementById('qualitySelect').value;
      const format = document.getElementById('formatSelect').value;

      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span>Starting...';

      const progressCard = document.getElementById('progressCard');
      progressCard.classList.remove('hidden');
      document.getElementById('progressError').classList.add('hidden');
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('progressPct').textContent = '0%';

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, quality, audio_only: audioOnly, format })
        });
        const data = await res.json();
        currentJob = data.job_id;
        pollProgress(currentJob);
      } catch (e) {
        showToast(e.message, 'error');
        btn.disabled = false;
        btn.textContent = '↓ Download Now';
      }
    }

    function pollProgress(jobId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${jobId}`);
          const job = await res.json();
          updateProgress(job);
          if (job.status === 'done' || job.status === 'error') {
            clearInterval(pollInterval);
            const btn = document.getElementById('downloadBtn');
            btn.disabled = false;
            btn.textContent = '↓ Download Now';
            if (job.status === 'done') {
              showToast('Download complete! ✓', 'success');
              if (job.filename) {
                downloadFile(job.filename);
              }
            }
          }
        } catch (e) { }
      }, 600);
    }

    function updateProgress(job) {
      const statusEl = document.getElementById('progressStatus');
      const pctEl = document.getElementById('progressPct');
      const fillEl = document.getElementById('progressFill');
      const speedEl = document.getElementById('progressSpeed');
      const etaEl = document.getElementById('progressEta');
      const fileEl = document.getElementById('progressFile');
      const errEl = document.getElementById('progressError');

      const statusMap = {
        queued: ['QUEUED', 'status-queued'],
        downloading: ['DOWNLOADING', 'status-downloading'],
        processing: ['PROCESSING', 'status-processing'],
        done: ['COMPLETE ✓', 'status-done'],
        error: ['ERROR', 'status-error'],
      };

      const [label, cls] = statusMap[job.status] || ['UNKNOWN', ''];
      statusEl.textContent = label;
      statusEl.className = 'progress-status ' + cls;

      const pct = job.progress || 0;
      pctEl.textContent = Math.round(pct) + '%';
      fillEl.style.width = pct + '%';

      speedEl.textContent = 'Speed: ' + (job.speed || '—');
      etaEl.textContent = 'ETA: ' + (job.eta || '—');
      fileEl.textContent = job.filename || '';

      if (job.status === 'error' && job.error) {
        errEl.textContent = job.error;
        errEl.classList.remove('hidden');
      }
    }

    async function loadFiles() {
      const el = document.getElementById('filesList');
      el.innerHTML = '<div class="empty-state"><div class="loader"></div></div>';
      try {
        const res = await fetch('/api/files');
        const files = await res.json();
        if (!files.length) {
          el.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div>No downloads yet</div>';
          return;
        }
        el.innerHTML = files.map(f => {
          const isAudio = f.name.match(/\.(mp3|aac|flac|ogg|wav|m4a)$/i);
          const icon = isAudio ? '🎵' : '🎬';
          const iconClass = isAudio ? 'audio' : 'video';
          return `
        <div class="file-item">
          <div class="file-icon ${iconClass}">${icon}</div>
          <div class="file-info">
            <div class="file-name">${escHtml(f.name)}</div>
            <div class="file-meta">${formatSize(f.size)} · ${new Date(f.modified * 1000).toLocaleDateString()}</div>
          </div>
          <div class="file-actions">
            <button class="btn-action dl" onclick="downloadFile('${escHtml(f.name)}')">⬇ Save</button>
            <button class="btn-action rm" onclick="deleteFile('${escHtml(f.name)}')">✕ Delete</button>
          </div>
        </div>`;
        }).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty-state">Failed to load files</div>';
      }
    }

    function downloadFile(name) {
      window.location.href = '/api/files/' + encodeURIComponent(name);
    }

    async function deleteFile(name) {
      if (!confirm(`Delete "${name}"?`)) return;
      await fetch('/api/files/' + encodeURIComponent(name), { method: 'DELETE' });
      loadFiles();
      showToast('Deleted', 'success');
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    let toastTimer;
    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = ''; }, 3500);
    }
  </script>
</body>

</html>
